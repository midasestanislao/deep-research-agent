[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A deep research agent built from scratch with LangGraph: scoping, parallel web researchers, a supervisor and a report writer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
]
